services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tasks_testing
      POSTGRES_USER: tasks_testing
      POSTGRES_PASSWORD: tasks_testing
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
