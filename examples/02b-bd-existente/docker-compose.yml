services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: legacy
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy
    ports:
      - "5439:5432"
    volumes:
      # El esquema "del DBA": Postgres lo ejecuta una sola vez, al crear el volumen vacío
      - ./docker/legacy-schema.sql:/docker-entrypoint-initdb.d/legacy-schema.sql:ro
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
