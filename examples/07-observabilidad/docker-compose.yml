services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tasks_observability
      POSTGRES_USER: tasks_observability
      POSTGRES_PASSWORD: tasks_observability
    ports:
      - "5438:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
