spring:
  application:
    name: 05-kafka
  datasource:
    url: jdbc:h2:mem:tasks_kafka;MODE=PostgreSQL
    username: sa
    password:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  cache:
    type: simple
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

app:
  jwt:
    secret: "test-secret-key-for-integration-tests-only-0123456789abcdef"
    expiration-millis: 3600000
